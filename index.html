<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diego Snake</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#111; font-family:'Share Tech Mono',monospace; color:#888; overflow:hidden; }
    #outer { width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    #hud { display:flex; gap:40px; font-size:0.9rem; letter-spacing:0.12em; text-transform:uppercase; flex-shrink:0; }
    #hud span { color:#ccc; }
    #wrapper { position:relative; border:1px solid #2a2a2a; background:#0a0a0a; flex-shrink:0; }
    canvas { display:block; }
    #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(10,10,10,0.93); z-index:10; gap:20px; }
    #overlay h2 { font-size:1.4rem; color:#ddd; letter-spacing:0.2em; text-transform:uppercase; text-align:center; }
    #overlay p { font-size:0.75rem; color:#555; text-align:center; line-height:2; }
    #startBtn { padding:12px 36px; background:transparent; border:1px solid #555; color:#aaa; font-family:'Share Tech Mono',monospace; font-size:0.8rem; letter-spacing:0.15em; cursor:pointer; text-transform:uppercase; }
    #startBtn:hover { border-color:#aaa; color:#eee; }
    #tips { font-size:0.65rem; color:#444; text-align:center; line-height:2.2; }
  </style>
</head>
<body>
<div id="outer">
  <div id="hud">
    <div>Score <span id="scoreVal">0</span></div>
    <div>Best <span id="highVal">0</span></div>
    <div>Level <span id="levelVal">1</span></div>
  </div>
  <div id="wrapper">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h2>Diego eats Timmy</h2>
      <p>Edges wrap around.<br>Eat every Timmy!</p>
      <button id="startBtn">Start</button>
      <div id="tips">Arrow keys or WASD &middot; P to pause</div>
    </div>
  </div>
</div>

function playEat(){
  if(!bufs.length) return;
  try{
    const a=getAC();
    if(a.state==='suspended') a.resume();
    const s=a.createBufferSource();
    s.buffer=bufs[Math.random()<0.5?0:1];
    s.connect(a.destination);
    s.start(0);
  }catch(e){}
}

let snake,dir,nextDir,food,score,highScore=0,level,stepMs,paused,gameOver;
let progress=0,lastTime=0,rafId,prevSnake=null;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; level=1; stepMs=160; progress=0; lastTime=0;
  scoreEl.textContent=0; levelEl.textContent=1;
  paused=false; gameOver=false; prevSnake=null;
  placeFood();
}
function placeFood(){
  let p;
  do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function gameLoop(ts){
  if(gameOver) return;
  rafId=requestAnimationFrame(gameLoop);
  if(paused){lastTime=ts;return;}
  const dt=lastTime?ts-lastTime:0; lastTime=ts;
  progress+=dt/stepMs;
  if(progress>=1){progress-=1;doStep();if(gameOver)return;}
  render(progress);
}
function doStep(){
  prevSnake=snake.map(s=>Object.assign({},s));
  dir=Object.assign({},nextDir);
  const h={x:(snake[0].x+dir.x+COLS)%COLS,y:(snake[0].y+dir.y+ROWS)%ROWS};
  if(snake.some(s=>s.x===h.x&&s.y===h.y)){endGame();return;}
  const ate=h.x===food.x&&h.y===food.y;
  snake.unshift(h);
  if(!ate) snake.pop();
  else{
    playEat();
    score+=10*level; scoreEl.textContent=score;
    if(score>highScore){highScore=score;highEl.textContent=highScore;}
    const nl=Math.floor(score/60)+1;
    if(nl!==level){level=nl;levelEl.textContent=level;stepMs=Math.max(70,160-(level-1)*12);}
    placeFood();
  }
}
function lerp(a,b,t){
  let dx=b.x-a.x,dy=b.y-a.y;
  if(dx>COLS/2)dx-=COLS;if(dx<-COLS/2)dx+=COLS;
  if(dy>ROWS/2)dy-=ROWS;if(dy<-ROWS/2)dy+=ROWS;
  return{x:a.x+dx*t,y:a.y+dy*t};
}
function render(t){
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  drawFood(); drawSnake(t);
}
function drawSnake(t){
  if(!imgUp.complete||!imgUp.naturalWidth||snake.length===0) return;
  const len=snake.length,total=len*CELL;
  const pos=snake.map((s,i)=>(!prevSnake||i>=prevSnake.length)?s:lerp(prevSnake[i],s,t));
  pos.forEach((p,i)=>{
    const px=p.x*CELL,py=p.y*CELL;
    ctx.save();
    ctx.beginPath(); ctx.rect(px-0.5,py-0.5,CELL+1,CELL+1); ctx.clip();
    if(dir.y===-1)      ctx.drawImage(imgUp,  px, py-i*CELL,          CELL, total);
    else if(dir.y===1)  ctx.drawImage(imgDown,px, py-(len-1-i)*CELL,  CELL, total);
    else if(dir.x===1)  ctx.drawImage(imgR,   px-(len-1-i)*CELL, py,  total, CELL);
    else                ctx.drawImage(imgL,   px-i*CELL,         py,  total, CELL);
    ctx.restore();
  });
}
function drawFood(){
  if(!food) return;
  const pulse=0.85+0.15*Math.sin(Date.now()/300);
  const sz=CELL*pulse,off=(CELL-sz)/2;
  ctx.drawImage(timmyImg,food.x*CELL+off,food.y*CELL+off,sz,sz);
}
function endGame(){
  gameOver=true; let f=0;
  const fl=setInterval(()=>{
    ctx.fillStyle=f%2===0?'rgba(255,255,255,0.07)':'rgba(0,0,0,0)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(++f>=6){clearInterval(fl);showOverlay('Game Over','Score: '+score);}
  },90);
}
function showOverlay(title,sub){
  overlay.innerHTML=`
    <h2 style="font-size:1.4rem;color:#ddd;letter-spacing:0.2em;text-transform:uppercase;">${title}</h2>
    <p style="color:#888;font-size:0.8rem;">${sub} &middot; Best: ${highScore}</p>
    <button id="startBtn" style="padding:12px 36px;background:transparent;border:1px solid #555;color:#aaa;font-family:'Share Tech Mono',monospace;font-size:0.8rem;letter-spacing:0.15em;cursor:pointer;text-transform:uppercase;">Play Again</button>
    <div style="font-size:0.65rem;color:#444;line-height:2.2;">Arrow keys or WASD &middot; P to pause</div>
  `;
  overlay.style.display='flex';
  overlay.querySelector('#startBtn').addEventListener('click',startGame);
}
function startGame(){
  overlay.style.display='none';
  cancelAnimationFrame(rafId);
  loadSounds();
  init();
  rafId=requestAnimationFrame(gameLoop);
}
document.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
  const nd=map[e.key];
  if(nd){if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;e.preventDefault();}
  if(e.key==='p'||e.key==='P') paused=!paused;
});
