<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diego Snake</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#111;
      font-family:'Share Tech Mono',monospace;
      color:#888;
      overflow:hidden;
    }
    #outer {
      width:100vw; height:100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:12px;
    }
    #hud {
      display:flex; gap:48px;
      font-size:0.85rem; letter-spacing:0.12em; text-transform:uppercase;
      flex-shrink:0;
    }
    #hud span { color:#ccc; }
    #wrapper {
      position:relative;
      border:1px solid #2a2a2a;
      background:#0a0a0a;
      flex-shrink:0;
    }
    canvas { display:block; }
    #overlay {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(10,10,10,0.93);
      z-index:10; gap:18px;
    }
    #overlay h2 {
      font-size:1.3rem; color:#ddd;
      letter-spacing:0.2em; text-transform:uppercase; text-align:center;
    }
    #overlay p { font-size:0.7rem; color:#555; text-align:center; line-height:2; }
    .btn {
      padding:11px 32px; background:transparent;
      border:1px solid #555; color:#aaa;
      font-family:'Share Tech Mono',monospace; font-size:0.75rem;
      letter-spacing:0.15em; cursor:pointer; text-transform:uppercase;
    }
    .btn:hover { border-color:#aaa; color:#eee; }
    #tips { font-size:0.6rem; color:#444; text-align:center; line-height:2.2; }
  </style>
</head>
<body>
<div id="outer">
  <div id="hud">
    <div>Score <span id="scoreVal">0</span></div>
    <div>Best <span id="highVal">0</span></div>
    <div>Level <span id="levelVal">1</span></div>
  </div>
  <div id="wrapper">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h2>Diego eats Timmy</h2>
      <p>Edges wrap around.<br>Eat every Timmy!</p>
      <button class="btn" id="startBtn">Start</button>
      <div id="tips">Arrow keys or WASD &nbsp;&middot;&nbsp; P to pause</div>
    </div>
  </div>
</div>

let snake, dir, nextDir, food;
let score, highScore=0, level, stepMs, paused, gameOver;
let progress=0, lastTime=0, rafId;
let prevSnake=null;

function init() {
  snake   = [{x:11,y:11},{x:10,y:11},{x:9,y:11}];
  dir     = {x:1,y:0};
  nextDir = {x:1,y:0};
  score=0; level=1; stepMs=160; progress=0; lastTime=0;
  scoreEl.textContent=0; levelEl.textContent=1;
  paused=false; gameOver=false; prevSnake=null;
  placeFood();
}

function placeFood() {
  let pos;
  do { pos={x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}

// ── Main loop (smooth interpolation) ────────────────────────────────────────
function gameLoop(ts) {
  if (gameOver) return;
  rafId=requestAnimationFrame(gameLoop);
  if (paused) { lastTime=ts; return; }

  const dt = lastTime ? ts-lastTime : 0;
  lastTime=ts;
  progress += dt / stepMs;

  if (progress >= 1) {
    progress -= 1;
    doStep();
    if (gameOver) return;
  }

  render(progress);
}

function doStep() {
  prevSnake = snake.map(s=>Object.assign({},s));
  dir = Object.assign({},nextDir);

  const head = {
    x:(snake[0].x+dir.x+COLS)%COLS,
    y:(snake[0].y+dir.y+ROWS)%ROWS
  };

  // Self collision
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) { endGame(); return; }

  const ate = head.x===food.x && head.y===food.y;
  snake.unshift(head);
  if (!ate) snake.pop();
  else {
    score+=10*level;
    scoreEl.textContent=score;
    if (score>highScore) { highScore=score; highEl.textContent=highScore; }
    const nl=Math.floor(score/60)+1;
    if (nl!==level) {
      level=nl; levelEl.textContent=level;
      stepMs=Math.max(70,160-(level-1)*12);
    }
    placeFood();
  }
}

// Lerp a position, handling wrap-around
function lerpPos(a, b, t) {
  let dx=b.x-a.x, dy=b.y-a.y;
  if (dx> COLS/2) dx-=COLS;
  if (dx<-COLS/2) dx+=COLS;
  if (dy> ROWS/2) dy-=ROWS;
  if (dy<-ROWS/2) dy+=ROWS;
  return {x:a.x+dx*t, y:a.y+dy*t};
}

function render(t) {
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawFood();
  drawSnake(t);
}

function drawSnake(t) {
  if (!diegoImg.complete||!diegoImg.naturalWidth||snake.length===0) return;
  const len=snake.length;

  // Build smoothed positions
  const pos = snake.map((seg,i)=>{
    if (!prevSnake||i>=prevSnake.length) return seg;
    return lerpPos(prevSnake[i],seg,t);
  });

  pos.forEach((p,i)=>{
    const cx=p.x*CELL+CELL/2;
    const cy=p.y*CELL+CELL/2;

    // Angle: rotate image so top (Diego's head) points in travel direction
    let angle;
    if (i===0) {
      if      (dir.x=== 1) angle= Math.PI/2;
      else if (dir.x===-1) angle=-Math.PI/2;
      else if (dir.y=== 1) angle= Math.PI;
      else                  angle= 0;
    } else {
      const pr=pos[i-1];
      let dx=pr.x-p.x, dy=pr.y-p.y;
      if (dx> COLS/2) dx-=COLS; if (dx<-COLS/2) dx+=COLS;
      if (dy> ROWS/2) dy-=ROWS; if (dy<-ROWS/2) dy+=ROWS;
      if      (dx> 0.1) angle= Math.PI/2;
      else if (dx<-0.1) angle=-Math.PI/2;
      else if (dy> 0.1) angle= Math.PI;
      else              angle= 0;
    }

    ctx.save();
    // Clip tightly to cell (1px overlap to hide seams)
    ctx.beginPath();
    ctx.rect(p.x*CELL-0.5, p.y*CELL-0.5, CELL+1, CELL+1);
    ctx.clip();
    ctx.translate(cx,cy);
    ctx.rotate(angle);
    // Draw full stretched image; segment i's slice sits at origin
    ctx.drawImage(
      diegoImg,
      -CELL/2,
      -(i+0.5)*CELL,
      CELL,
      len*CELL
    );
    ctx.restore();
  });
}

function drawFood() {
  if (!food) return;
  const pulse=0.85+0.15*Math.sin(Date.now()/300);
  const sz=CELL*pulse, off=(CELL-sz)/2;
  ctx.drawImage(timmyImg, food.x*CELL+off, food.y*CELL+off, sz, sz);
}

function endGame() {
  gameOver=true;
  let f=0;
  const fl=setInterval(()=>{
    ctx.fillStyle=f%2===0?'rgba(255,255,255,0.07)':'rgba(0,0,0,0)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(++f>=6){ clearInterval(fl); showOverlay('Game Over','Score: '+score); }
  },90);
}

function showOverlay(title,sub) {
  overlay.innerHTML=`
    <h2 style="font-size:1.3rem;color:#ddd;letter-spacing:0.2em;text-transform:uppercase;">${title}</h2>
    <p style="color:#888;font-size:0.75rem;">${sub} &nbsp;&middot;&nbsp; Best: ${highScore}</p>
    <button class="btn" id="startBtn" style="padding:11px 32px;background:transparent;border:1px solid #555;color:#aaa;font-family:'Share Tech Mono',monospace;font-size:0.75rem;letter-spacing:0.15em;cursor:pointer;text-transform:uppercase;">Play Again</button>
    <div style="font-size:0.6rem;color:#444;line-height:2.2;">Arrow keys or WASD &nbsp;&middot;&nbsp; P to pause</div>
  `;
  overlay.style.display='flex';
  overlay.querySelector('#startBtn').addEventListener('click',startGame);
}

function startGame() {
  overlay.style.display='none';
  cancelAnimationFrame(rafId);
  init();
  rafId=requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown',e=>{
  const map={
    ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},
    ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
    ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},
    ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0},
  };
  const nd=map[e.key];
  if(nd){ if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd; e.preventDefault(); }
  if(e.key==='p'||e.key==='P') paused=!paused;
});

document.getElementById('startBtn').addEventListener('click',startGame);
ctx.fillStyle='#0a0a0a';
ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
